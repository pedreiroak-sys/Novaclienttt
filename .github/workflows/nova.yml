          /**
           * Menu do Nova Client: desenhado à mão (vermelho e branco), com abas e botões grandes para toque.
           */
          public class NovaMenuScreen extends Screen {
              private static final int RED = 0xFFE11D2E;
              private static final int RED_HOVER = 0xFFF2434F;
              private static final int WHITE = 0xFFFFFFFF;
              private static final int WHITE_SOFT = 0xFFFFE3E5;
              private static final int GRAY = 0xFFA6A6B2;
              private static final int PANEL = 0xF0121217;
              private static final int TILE = 0xFF24242C;
              private static final int TILE_HOVER = 0xFF30303A;
              private static final int BORDER = 0xFF3A3A46;
              private static final int DIM = 0x88000000;

              private static final String[] TAB_NAMES = {"HUD", "Armadura", "Mapa", "Módulos", "Desempenho"};
              private static final String[] CORNERS = {"Topo esq.", "Topo dir.", "Baixo esq.", "Baixo dir."};
              private static final String[] ARMOR_POS = {"Topo esq.", "Topo dir.", "Baixo esq.", "Baixo dir.", "No HUD"};
              private static final String[] ARMOR_MODES = {"Número", "Porcentagem", "Número + %", "Só ícone"};
              private static final String[] ARMOR_LAYOUT = {"Vertical", "Horizontal"};
              private static final String[] PROFILES = {"Normal", "Equilibrado", "Máximo"};
              private static final int[] FPS_STEPS = {30, 60, 90, 120, 144, 260};

              private static final int PAD = 8;
              private static final int GAP = 5;
              private static final int HEADER = 26;
              private static final int TAB_H = 16;
              private static final int FOOTER = 24;
              private static final int STEP_W = 22;

              private static int lastTab = 0;

              private final Screen parent;
              private final List<Tile> tiles = new ArrayList<>();

              private int tab;
              private int px, py, pw, ph;
              private int tabY;
              private int doneX, doneY, doneW;
              private final int[] tabX = new int[TAB_NAMES.length];
              private int tabW;

              public NovaMenuScreen(Screen parent) {
                  super(Text.literal("Nova Client"));
                  this.parent = parent;
              }

              // ------------------------------------------------------------------ montagem das abas

              @Override
              protected void init() {
                  tab = Math.max(0, Math.min(TAB_NAMES.length - 1, lastTab));
                  rebuild();
              }

              private void rebuild() {
                  NovaConfig c = NovaConfig.INSTANCE;
                  tiles.clear();

                  switch (tab) {
                      case 0 -> {
                          tiles.add(toggle("HUD", () -> c.hudEnabled, v -> c.hudEnabled = v));
                          tiles.add(toggle("FPS", () -> c.showFps, v -> c.showFps = v));
                          tiles.add(toggle("Ping", () -> c.showPing, v -> c.showPing = v));
                          tiles.add(toggle("Coords", () -> c.showCoords, v -> c.showCoords = v));
                          tiles.add(toggle("Direção", () -> c.showDirection, v -> c.showDirection = v));
                          tiles.add(toggle("Relógio", () -> c.showClock, v -> c.showClock = v));
                          tiles.add(toggle("CPS", () -> c.showCps, v -> c.showCps = v));
                          tiles.add(stepper("Tamanho",
                                  () -> c.hudScalePercent + "%",
                                  () -> c.hudScalePercent = Math.max(60, c.hudScalePercent - 10),
                                  () -> c.hudScalePercent = Math.min(200, c.hudScalePercent + 10)));
                          tiles.add(cycle("Posição", CORNERS, () -> c.hudCorner, v -> c.hudCorner = v));
                      }
                      case 1 -> {
                          tiles.add(toggle("Armadura", () -> c.showArmor, v -> c.showArmor = v));
                          tiles.add(cycle("Modo", ARMOR_MODES, () -> c.armorMode, v -> c.armorMode = v));
                          tiles.add(cycle("Posição", ARMOR_POS, () -> c.armorCorner, v -> c.armorCorner = v));
                          tiles.add(cycle("Layout", ARMOR_LAYOUT,
                                  () -> c.armorHorizontal ? 1 : 0, v -> c.armorHorizontal = v == 1));
                          tiles.add(toggle("Itens nas mãos", () -> c.armorShowHands, v -> c.armorShowHands = v));
                          tiles.add(toggle("Cor por durab.", () -> c.armorColorByDurability,
                                  v -> c.armorColorByDurability = v));
                      }
                      case 2 -> {
                          tiles.add(toggle("Minimapa", () -> c.minimapEnabled, v -> c.minimapEnabled = v));
                          tiles.add(stepper("Tamanho",
                                  () -> c.minimapSize + "px",
                                  () -> c.minimapSize = Math.max(48, c.minimapSize - 16),
                                  () -> c.minimapSize = Math.min(128, c.minimapSize + 16)));
                          tiles.add(stepper("Alcance",
                                  () -> "±" + (c.minimapCells / 2) + " blocos",
                                  () -> c.minimapCells = Math.max(32, c.minimapCells - 16),
                                  () -> c.minimapCells = Math.min(64, c.minimapCells + 16)));
                          tiles.add(cycle("Posição", CORNERS, () -> c.minimapCorner, v -> c.minimapCorner = v));
                          tiles.add(toggle("Jogadores", () -> c.minimapPlayers, v -> c.minimapPlayers = v));
                          tiles.add(toggle("WP no mapa", () -> c.minimapWaypoints, v -> c.minimapWaypoints = v));
                          tiles.add(toggle("WP no mundo", () -> c.waypointsInWorld, v -> c.waypointsInWorld = v));
                          tiles.add(action("+ Waypoint aqui", () -> {
                              NovaConfig.Waypoint w = Waypoints.addHere(client, Waypoints.nextName());
                              message(w == null ? "Entre em um mundo primeiro" : "Waypoint criado: " + w.name);
                          }));
                          tiles.add(action("Apagar último", () -> {
                              String name = Waypoints.removeLast(client);
                              message(name == null ? "Nenhum waypoint aqui" : "Apagado: " + name);
                          }));
                      }
                      case 3 -> {
                          tiles.add(toggle("Auto Sprint", () -> c.autoSprint, v -> c.autoSprint = v));
                          tiles.add(toggle("Fullbright", () -> c.fullbright, v -> c.fullbright = v));
                          tiles.add(toggle("Hit Delay Fix", () -> c.hitDelayFix, v -> c.hitDelayFix = v));
                          tiles.add(stepper("Zoom",
                                  () -> String.format(Locale.ROOT, "%.1fx", 70f / c.zoomFov),
                                  () -> c.zoomFov = Math.min(70, c.zoomFov + 10),
                                  () -> c.zoomFov = Math.max(30, c.zoomFov - 10)));
                          tiles.add(toggle("Teclas", () -> c.showKeystrokes, v -> c.showKeystrokes = v));
                          tiles.add(cycle("Pos. teclas", CORNERS, () -> c.keysCorner, v -> c.keysCorner = v));
                          tiles.add(toggle("Efeitos", () -> c.showEffects, v -> c.showEffects = v));
                          tiles.add(cycle("Pos. efeitos", CORNERS, () -> c.effectsCorner, v -> c.effectsCorner = v));
                          tiles.add(toggle("WP de morte", () -> c.deathWaypoint, v -> c.deathWaypoint = v));
                      }
                      default -> {
                          tiles.add(stepper("Perfil",
                                  () -> PROFILES[Math.floorMod(c.perfProfile, 3)],
                                  () -> setProfile(c, c.perfProfile + 2),
                                  () -> setProfile(c, c.perfProfile + 1)));
                          tiles.add(stepper("Distância",
                                  () -> client == null ? "-" : client.options.getViewDistance().getValue() + " chunks",
                                  () -> {
                                      if (client != null) {
                                          int v = client.options.getViewDistance().getValue();
                                          client.options.getViewDistance().setValue(Math.max(2, v - 2));
                                          client.options.write();
                                      }
                                  },
                                  () -> {
                                      if (client != null) {
                                          int v = client.options.getViewDistance().getValue();
                                          client.options.getViewDistance().setValue(Math.min(16, v + 2));
                                          client.options.write();
                                      }
                                  }));
                          tiles.add(stepper("FPS máx.",
                                  () -> {
                                      if (client == null) {
                                          return "-";
                                      }
                                      int v = client.options.getMaxFps().getValue();
                                      return v >= 260 ? "Sem limite" : String.valueOf(v);
                                  },
                                  () -> stepFps(-1),
                                  () -> stepFps(1)));
                      }
                  }

                  layout();
              }

              private void setProfile(NovaConfig c, int value) {
                  c.perfProfile = Math.floorMod(value, 3);
                  if (client != null) {
                      Performance.apply(client, c.perfProfile);
                  }
              }

              private void stepFps(int dir) {
                  if (client == null) {
                      return;
                  }
                  int v = client.options.getMaxFps().getValue();
                  int idx = FPS_STEPS.length - 1;
                  for (int i = 0; i < FPS_STEPS.length; i++) {
                      if (v <= FPS_STEPS[i]) {
                          idx = i;
                          break;
                      }
                  }
                  idx = Math.max(0, Math.min(FPS_STEPS.length - 1, idx + dir));
                  client.options.getMaxFps().setValue(FPS_STEPS[idx]);
                  client.options.write();
              }

              private void message(String text) {
                  if (client != null && client.player != null) {
                      client.player.sendMessage(Text.literal(text), true);
                  }
              }

              // ------------------------------------------------------------------ layout

              private void layout() {
                  int cols = width >= 330 ? 3 : 2;
                  int rows = Math.max(1, (tiles.size() + cols - 1) / cols);

                  pw = Math.min(width - 10, 440);
                  int tileW = (pw - 2 * PAD - GAP * (cols - 1)) / cols;

                  int top = HEADER + 4 + TAB_H + 6;
                  int bottom = 4 + FOOTER + PAD;
                  int avail = height - 8 - top - bottom;
                  int tileH = Math.max(20, Math.min(40, (avail - GAP * (rows - 1)) / rows));

                  ph = top + rows * tileH + (rows - 1) * GAP + bottom;
                  px = (width - pw) / 2;
                  py = Math.max(4, (height - ph) / 2);

                  for (int i = 0; i < tiles.size(); i++) {
                      Tile t = tiles.get(i);
                      t.x = px + PAD + (i % cols) * (tileW + GAP);
                      t.y = py + top + (i / cols) * (tileH + GAP);
                      t.w = tileW;
                      t.h = tileH;
                  }

                  int n = TAB_NAMES.length;
                  tabW = (pw - 2 * PAD - 3 * (n - 1)) / n;
                  tabY = py + HEADER + 4;
                  for (int i = 0; i < n; i++) {
                      tabX[i] = px + PAD + i * (tabW + 3);
                  }

                  doneX = px + PAD;
                  doneW = pw - 2 * PAD;
                  doneY = py + ph - PAD - FOOTER;
              }

              // ------------------------------------------------------------------ desenho

              @Override
              public void render(DrawContext ctx, int mouseX, int mouseY, float delta) {
                  // fundo escurecido leve: dá para ver o HUD mudando ao fundo
                  ctx.fill(0, 0, width, height, DIM);

                  // painel
                  rounded(ctx, px, py, px + pw, py + ph, PANEL);

                  // cabeçalho vermelho
                  rounded(ctx, px, py, px + pw, py + HEADER, RED);
                  ctx.fill(px, py + HEADER - 4, px + pw, py + HEADER, RED);
                  textLeft(ctx, "NOVA CLIENT", px + PAD, py + HEADER / 2f, 1.25f, WHITE, true);
                  text(ctx, "1.20.1", px + pw - PAD, py + HEADER / 2f, 0.8f, WHITE_SOFT, false, true);

                  // abas
                  for (int i = 0; i < TAB_NAMES.length; i++) {
                      boolean active = i == tab;
                      boolean hover = inside(mouseX, mouseY, tabX[i], tabY, tabW, TAB_H);
                      int bg = active ? RED : (hover ? TILE_HOVER : TILE);
                      rounded(ctx, tabX[i], tabY, tabX[i] + tabW, tabY + TAB_H, bg);
                      text(ctx, TAB_NAMES[i], tabX[i] + tabW / 2f, tabY + TAB_H / 2f, 0.8f,
                              active ? WHITE : GRAY, active, false);
                  }

                  for (Tile t : tiles) {
                      t.draw(ctx, mouseX, mouseY);
                  }

                  // botão PRONTO (branco com texto vermelho)
                  boolean hoverDone = inside(mouseX, mouseY, doneX, doneY, doneW, FOOTER);
                  rounded(ctx, doneX, doneY, doneX + doneW, doneY + FOOTER, hoverDone ? WHITE_SOFT : WHITE);
                  text(ctx, "PRONTO", doneX + doneW / 2f, doneY + FOOTER / 2f, 1.1f, RED, true, false);

                  super.render(ctx, mouseX, mouseY, delta);
              }

              private static boolean inside(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx < x + w && my >= y && my < y + h;
              }

              /** Retângulo com cantos arredondados (sem sobreposição, funciona com cores translúcidas). */
              private static void rounded(DrawContext c, int x1, int y1, int x2, int y2, int color) {
                  c.fill(x1 + 2, y1, x2 - 2, y2, color);
                  c.fill(x1 + 1, y1 + 1, x1 + 2, y2 - 1, color);
                  c.fill(x2 - 2, y1 + 1, x2 - 1, y2 - 1, color);
                  c.fill(x1, y1 + 2, x1 + 1, y2 - 2, color);
                  c.fill(x2 - 1, y1 + 2, x2, y2 - 2, color);
              }

              /**
               * Texto com escala, centralizado em x (ou terminando em x, se right for true).
               * cy é o centro vertical do texto.
               */
              private void text(DrawContext ctx, String s, float x, float cy, float scale, int color,
                                boolean bold, boolean right) {
                  Text t = bold ? Text.literal(s).formatted(Formatting.BOLD) : Text.literal(s);
                  int w = textRenderer.getWidth(t);
                  drawScaled(ctx, t, x, cy, scale, color, right ? -w : -w / 2);
              }

              /** Texto com escala começando em x (alinhado à esquerda). */
              private void textLeft(DrawContext ctx, String s, float x, float cy, float scale, int color, boolean bold) {
                  Text t = bold ? Text.literal(s).formatted(Formatting.BOLD) : Text.literal(s);
                  drawScaled(ctx, t, x, cy, scale, color, 0);
              }

              private void drawScaled(DrawContext ctx, Text t, float x, float cy, float scale, int color, int dx) {
                  ctx.getMatrices().push();
                  ctx.getMatrices().translate(x, cy, 0);
                  ctx.getMatrices().scale(scale, scale, 1f);
                  ctx.drawTextWithShadow(textRenderer, t, dx, -4, color);
                  ctx.getMatrices().pop();
              }

              private void click() {
                  if (client != null) {
                      client.getSoundManager().play(PositionedSoundInstance.master(SoundEvents.UI_BUTTON_CLICK, 1.0f));
                  }
              }

              // ------------------------------------------------------------------ entrada

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  if (button == 0) {
                      for (int i = 0; i < TAB_NAMES.length; i++) {
                          if (inside(mouseX, mouseY, tabX[i], tabY, tabW, TAB_H)) {
                              if (i != tab) {
                                  NovaConfig.save();
                                  tab = i;
                                  lastTab = i;
                                  rebuild();
                              }
                              click();
                              return true;
                          }
                      }
                      for (Tile t : tiles) {
                          if (t.contains(mouseX, mouseY)) {
                              t.click(mouseX);
                              click();
                              return true;
                          }
                      }
                      if (inside(mouseX, mouseY, doneX, doneY, doneW, FOOTER)) {
                          click();
                          close();
                          return true;
                      }
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              @Override
              public void removed() {
                  NovaConfig.save();
              }

              @Override
              public void close() {
                  if (client != null) {
                      client.setScreen(parent);
                  }
              }

              // ------------------------------------------------------------------ botões

              private Tile toggle(String label, BooleanSupplier getter, Consumer<Boolean> setter) {
                  return new Tile(label, getter, setter, null, null, null, null);
              }

              private Tile stepper(String label, Supplier<String> value, Runnable dec, Runnable inc) {
                  return new Tile(label, null, null, value, dec, inc, null);
              }

              private Tile action(String label, Runnable run) {
                  return new Tile(label, null, null, null, null, null, run);
              }

              /** Stepper que percorre uma lista de nomes. */
              private Tile cycle(String label, String[] names, IntSupplier get, IntConsumer set) {
                  int n = names.length;
                  return stepper(label,
                          () -> names[Math.floorMod(get.getAsInt(), n)],
                          () -> set.accept(Math.floorMod(get.getAsInt() - 1, n)),
                          () -> set.accept(Math.floorMod(get.getAsInt() + 1, n)));
              }

              private final class Tile {
                  final String label;
                  final BooleanSupplier getter;
                  final Consumer<Boolean> setter;
                  final Supplier<String> value;
                  final Runnable dec;
                  final Runnable inc;
                  final Runnable action;
                  int x, y, w, h;

                  Tile(String label, BooleanSupplier getter, Consumer<Boolean> setter,
                       Supplier<String> value, Runnable dec, Runnable inc, Runnable action) {
                      this.label = label;
                      this.getter = getter;
                      this.setter = setter;
                      this.value = value;
                      this.dec = dec;
                      this.inc = inc;
                      this.action = action;
                  }

                  boolean contains(double mx, double my) {
                      return inside(mx, my, x, y, w, h);
                  }

                  void click(double mx) {
                      if (action != null) {
                          action.run();
                      } else if (getter != null) {
                          setter.accept(!getter.getAsBoolean());
                      } else if (mx < x + 3 + STEP_W) {
                          dec.run();
                      } else if (mx >= x + w - 3 - STEP_W) {
                          inc.run();
                      }
                  }

                  void draw(DrawContext ctx, int mx, int my) {
                      boolean hover = contains(mx, my);
                      float cx = x + w / 2f;
                      float cy = y + h / 2f;

                      if (action != null) {
                          rounded(ctx, x, y, x + w, y + h, hover ? WHITE : RED);
                          rounded(ctx, x + 1, y + 1, x + w - 1, y + h - 1, hover ? TILE_HOVER : TILE);
                          text(ctx, label, cx, cy, 0.9f, WHITE, true, false);
                          return;
                      }

                      if (getter != null) {
                          boolean on = getter.getAsBoolean();
                          int bg = on ? (hover ? RED_HOVER : RED) : (hover ? TILE_HOVER : TILE);
                          int border = hover ? WHITE : (on ? RED : BORDER);
                          rounded(ctx, x, y, x + w, y + h, border);
                          rounded(ctx, x + 1, y + 1, x + w - 1, y + h - 1, bg);

                          if (h >= 30) {
                              text(ctx, label, cx, cy - 5, 1.0f, WHITE, on, false);
                              text(ctx, on ? "ON" : "OFF", cx, cy + 8, 0.8f, on ? WHITE_SOFT : GRAY, false, false);
                          } else {
                              text(ctx, label + ": " + (on ? "ON" : "OFF"), cx, cy, 0.85f, on ? WHITE : GRAY, on, false);
                          }
                          return;
                      }

                      // stepper: [ - ]  valor  [ + ]
                      rounded(ctx, x, y, x + w, y + h, BORDER);
                      rounded(ctx, x + 1, y + 1, x + w - 1, y + h - 1, TILE);

                      boolean hl = hover && mx < x + 3 + STEP_W;
                      boolean hr = hover && mx >= x + w - 3 - STEP_W;
                      rounded(ctx, x + 3, y + 3, x + 3 + STEP_W, y + h - 3, hl ? RED_HOVER : RED);
                      rounded(ctx, x + w - 3 - STEP_W, y + 3, x + w - 3, y + h - 3, hr ? RED_HOVER : RED);
                      text(ctx, "-", x + 3 + STEP_W / 2f, cy, 1.5f, WHITE, true, false);
                      text(ctx, "+", x + w - 3 - STEP_W / 2f, cy, 1.5f, WHITE, true, false);

                      String v = value.get();
                      if (h >= 30) {
                          text(ctx, label, cx, cy - 7, 0.7f, GRAY, false, false);
                          text(ctx, v, cx, cy + 5, 0.9f, WHITE, true, false);
                      } else {
                          String s = label + ": " + v;
                          float sc = 0.8f;
                          int avail = w - 2 * (STEP_W + 6);
                          if (textRenderer.getWidth(s) * sc > avail) {
                              s = v;
                          }
                          text(ctx, s, cx, cy, sc, WHITE, true, false);
                      }
                  }
              }
          }
