name: Nova Client Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Criar arquivos do projeto
        run: |
          cat > 'settings.gradle' <<'NOVA_EOF_MARKER'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          NOVA_EOF_MARKER
          cat > 'gradle.properties' <<'NOVA_EOF_MARKER'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Minecraft 1.20.1
          minecraft_version=1.20.1
          yarn_mappings=1.20.1+build.10
          loader_version=0.15.11

          # Mod
          mod_version=1.2.0
          maven_group=com.novaclient
          archives_base_name=novaclient

          # Fabric API
          fabric_version=0.92.2+1.20.1
          NOVA_EOF_MARKER
          cat > 'build.gradle' <<'NOVA_EOF_MARKER'
          plugins {
              id 'fabric-loom' version '1.6-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 17
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/HudRenderer.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.network.ClientPlayNetworkHandler;
          import net.minecraft.client.network.PlayerListEntry;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.item.ItemStack;
          import net.minecraft.util.math.Direction;

          import java.time.LocalTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          /**
           * Desenha o HUD (FPS, ping, coordenadas, CPS, armadura, minimapa, teclas, efeitos) em vermelho e branco.
           */
          public final class HudRenderer {
              private static final DateTimeFormatter CLOCK = DateTimeFormatter.ofPattern("HH:mm:ss");

              private static final int RED = 0xFFE11D2E;
              private static final int LABEL = 0xFFFF5A66;
              private static final int WHITE = 0xFFFFFFFF;
              private static final int BG = 0xB0121217;
              private static final int GREEN = 0xFF55FF55;
              private static final int YELLOW = 0xFFFFD84A;
              private static final int WARN = 0xFFFF4D4D;

              private static final int PAD = 5;
              private static final int STRIPE = 2;
              private static final int LINE_H = 11;
              private static final int ARMOR_ROW_H = 18;
              private static final int MARGIN = 4;
              private static final int LABEL_GAP = 6;

              /** Altura já ocupada em cada canto (para empilhar painéis sem sobrepor). */
              private static final int[] CORNER_OFFSET = new int[4];

              private static long windowStart = System.nanoTime();
              private static int frames = 0;
              private static int fps = 0;

              private static final ArrayDeque<Long> LEFT_CLICKS = new ArrayDeque<>();
              private static final ArrayDeque<Long> RIGHT_CLICKS = new ArrayDeque<>();
              private static boolean lastAttack = false;
              private static boolean lastUse = false;

              private record Row(String label, String value) {
              }

              private HudRenderer() {
              }

              // ------------------------------------------------------------------ CPS

              /** Chamado a cada tick: conta cliques (resolução de 20 Hz). */
              public static void tickInput(MinecraftClient mc) {
                  long now = System.currentTimeMillis();
                  boolean atk = mc.currentScreen == null && mc.options.attackKey.isPressed();
                  boolean use = mc.currentScreen == null && mc.options.useKey.isPressed();
                  if (atk && !lastAttack) {
                      LEFT_CLICKS.addLast(now);
                  }
                  if (use && !lastUse) {
                      RIGHT_CLICKS.addLast(now);
                  }
                  lastAttack = atk;
                  lastUse = use;
                  prune(LEFT_CLICKS, now);
                  prune(RIGHT_CLICKS, now);
              }

              private static void prune(ArrayDeque<Long> q, long now) {
                  while (!q.isEmpty() && now - q.peekFirst() > 1000L) {
                      q.pollFirst();
                  }
              }

              // ------------------------------------------------------------------ render

              public static void render(DrawContext ctx, float tickDelta) {
                  updateFps();

                  MinecraftClient mc = MinecraftClient.getInstance();
                  NovaConfig cfg = NovaConfig.INSTANCE;

                  if (!cfg.hudEnabled || mc.player == null || mc.world == null
                          || mc.options.hudHidden || mc.options.debugEnabled) {
                      return;
                  }

                  float scale = cfg.hudScalePercent / 100f;
                  float vw = ctx.getScaledWindowWidth() / scale;
                  float vh = ctx.getScaledWindowHeight() / scale;
                  Arrays.fill(CORNER_OFFSET, 0);

                  List<Row> rows = new ArrayList<>();
                  if (cfg.showFps) {
                      rows.add(new Row("FPS", String.valueOf(fps)));
                  }
                  if (cfg.showPing) {
                      rows.add(new Row("PING", ping(mc)));
                  }
                  if (cfg.showCoords) {
                      rows.add(new Row("XYZ", String.format(Locale.ROOT, "%.1f / %.1f / %.1f",
                              mc.player.getX(), mc.player.getY(), mc.player.getZ())));
                  }
                  if (cfg.showDirection) {
                      Direction facing = mc.player.getHorizontalFacing();
                      rows.add(new Row("DIR", capitalize(facing.asString())));
                  }
                  if (cfg.showClock) {
                      rows.add(new Row("HORA", LocalTime.now().format(CLOCK)));
                  }
                  if (cfg.showCps) {
                      rows.add(new Row("CPS", LEFT_CLICKS.size() + " | " + RIGHT_CLICKS.size()));
                  }
                  if (cfg.autoSprint) {
                      rows.add(new Row("SPRINT", "Auto"));
                  }

                  List<ItemStack> armor = cfg.showArmor ? armorItems(mc, cfg) : new ArrayList<>();
                  boolean armorInside = cfg.armorCorner == 4;

                  ctx.getMatrices().push();
                  ctx.getMatrices().scale(scale, scale, 1f);

                  // painel principal (com a armadura dentro, se configurado assim)
                  drawPanel(ctx, mc, cfg, rows, armorInside ? armor : new ArrayList<>(), cfg.hudCorner, vw, vh, LABEL);

                  // armadura em painel separado
                  if (!armorInside && !armor.isEmpty()) {
                      drawPanel(ctx, mc, cfg, new ArrayList<>(), armor, cfg.armorCorner, vw, vh, LABEL);
                  }

                  // minimapa
                  if (cfg.minimapEnabled) {
                      int size = cfg.minimapSize;
                      int[] pos = place(cfg.minimapCorner, size + 2, size + 2, vw, vh);
                      MinimapRenderer.draw(ctx, mc, pos[0] + 1, pos[1] + 1, size);
                  }

                  // efeitos de poção
                  if (cfg.showEffects) {
                      drawEffects(ctx, mc, cfg, vw, vh);
                  }

                  // teclas
                  if (cfg.showKeystrokes) {
                      drawKeys(ctx, mc, cfg, vw, vh);
                  }

                  ctx.getMatrices().pop();

                  // waypoints no mundo (sem a escala do HUD)
                  if (cfg.waypointsInWorld) {
                      Waypoints.renderWorld(ctx, mc);
                  }
              }

              // ------------------------------------------------------------------ painéis

              private static int[] place(int corner, int w, int h, float vw, float vh) {
                  boolean right = corner == 1 || corner == 3;
                  boolean bottom = corner == 2 || corner == 3;
                  int x = right ? Math.round(vw - w - MARGIN) : MARGIN;
                  int y = bottom
                          ? Math.round(vh - h - MARGIN - CORNER_OFFSET[corner])
                          : MARGIN + CORNER_OFFSET[corner];
                  CORNER_OFFSET[corner] += h + MARGIN;
                  return new int[]{x, y};
              }

              private static void box(DrawContext ctx, int x, int y, int w, int h) {
                  ctx.fill(x, y, x + w, y + h, BG);
                  ctx.fill(x, y, x + STRIPE, y + h, RED);
              }

              private static void drawPanel(DrawContext ctx, MinecraftClient mc, NovaConfig cfg, List<Row> rows,
                                            List<ItemStack> armor, int corner, float vw, float vh, int labelColor) {
                  if (rows.isEmpty() && armor.isEmpty()) {
                      return;
                  }
                  TextRenderer tr = mc.textRenderer;

                  int labelW = 0;
                  int valueW = 0;
                  for (Row row : rows) {
                      labelW = Math.max(labelW, tr.getWidth(row.label()));
                      valueW = Math.max(valueW, tr.getWidth(row.value()));
                  }
                  int contentW = rows.isEmpty() ? 0 : labelW + LABEL_GAP + valueW;
                  int[] as = armorSize(mc, armor, cfg);
                  contentW = Math.max(contentW, as[0]);

                  int boxW = STRIPE + PAD + contentW + PAD;
                  int boxH = PAD * 2 - 1 + rows.size() * LINE_H + as[1];
                  int[] pos = place(corner, boxW, boxH, vw, vh);
                  int x = pos[0];
                  int y = pos[1];

                  box(ctx, x, y, boxW, boxH);

                  int tx = x + STRIPE + PAD;
                  int ty = y + PAD;
                  for (Row row : rows) {
                      ctx.drawTextWithShadow(tr, row.label(), tx, ty, labelColor);
                      ctx.drawTextWithShadow(tr, row.value(), tx + labelW + LABEL_GAP, ty, WHITE);
                      ty += LINE_H;
                  }
                  if (!armor.isEmpty()) {
                      drawArmor(ctx, mc, cfg, armor, tx, ty);
                  }
              }

              private static void drawEffects(DrawContext ctx, MinecraftClient mc, NovaConfig cfg, float vw, float vh) {
                  List<Row> rows = new ArrayList<>();
                  for (StatusEffectInstance e : mc.player.getStatusEffects()) {
                      String name = e.getEffectType().getName().getString();
                      if (e.getAmplifier() > 0) {
                          name += " " + (e.getAmplifier() + 1);
                      }
                      rows.add(new Row(name, timeText(e.getDuration())));
                  }
                  drawPanel(ctx, mc, cfg, rows, new ArrayList<>(), cfg.effectsCorner, vw, vh, WHITE);
              }

              private static String timeText(int ticks) {
                  if (ticks > 1_000_000) {
                      return "--:--";
                  }
                  int s = ticks / 20;
                  return String.format(Locale.ROOT, "%d:%02d", s / 60, s % 60);
              }

              private static void drawKeys(DrawContext ctx, MinecraftClient mc, NovaConfig cfg, float vw, float vh) {
                  int cell = 18;
                  int gap = 2;
                  int w = cell * 3 + gap * 2;
                  int h = cell * 3 + gap * 3 + 8;
                  int[] pos = place(cfg.keysCorner, w, h, vw, vh);
                  int x = pos[0];
                  int y = pos[1];

                  var o = mc.options;
                  key(ctx, mc, x + cell + gap, y, cell, cell, "W", o.forwardKey.isPressed());
                  int y2 = y + cell + gap;
                  key(ctx, mc, x, y2, cell, cell, "A", o.leftKey.isPressed());
                  key(ctx, mc, x + cell + gap, y2, cell, cell, "S", o.backKey.isPressed());
                  key(ctx, mc, x + (cell + gap) * 2, y2, cell, cell, "D", o.rightKey.isPressed());

                  int y3 = y2 + cell + gap;
                  int half = (w - gap) / 2;
                  key(ctx, mc, x, y3, half, cell, "L " + LEFT_CLICKS.size(), o.attackKey.isPressed());
                  key(ctx, mc, x + half + gap, y3, w - half - gap, cell, "R " + RIGHT_CLICKS.size(), o.useKey.isPressed());

                  key(ctx, mc, x, y3 + cell + gap, w, 8, "", o.jumpKey.isPressed());
              }

              private static void key(DrawContext ctx, MinecraftClient mc, int x, int y, int w, int h,
                                      String label, boolean pressed) {
                  ctx.fill(x, y, x + w, y + h, pressed ? RED : BG);
                  if (!label.isEmpty()) {
                      ctx.drawCenteredTextWithShadow(mc.textRenderer, label, x + w / 2, y + (h - 8) / 2, WHITE);
                  }
              }

              // ------------------------------------------------------------------ armadura

              private static List<ItemStack> armorItems(MinecraftClient mc, NovaConfig cfg) {
                  List<ItemStack> list = new ArrayList<>();
                  // slot 3 = capacete ... slot 0 = botas
                  for (int slot = 3; slot >= 0; slot--) {
                      ItemStack stack = mc.player.getInventory().getArmorStack(slot);
                      if (!stack.isEmpty()) {
                          list.add(stack);
                      }
                  }
                  if (cfg.armorShowHands) {
                      ItemStack main = mc.player.getMainHandStack();
                      if (!main.isEmpty()) {
                          list.add(main);
                      }
                      ItemStack off = mc.player.getOffHandStack();
                      if (!off.isEmpty()) {
                          list.add(off);
                      }
                  }
                  return list;
              }

              private static String armorText(ItemStack s, int mode) {
                  if (mode == 3) {
                      return "";
                  }
                  if (s.isDamageable()) {
                      int max = s.getMaxDamage();
                      int left = max - s.getDamage();
                      int pct = Math.round(left * 100f / max);
                      return switch (mode) {
                          case 0 -> String.valueOf(left);
                          case 1 -> pct + "%";
                          default -> left + " (" + pct + "%)";
                      };
                  }
                  return s.getCount() > 1 ? "x" + s.getCount() : "";
              }

              private static int armorColor(ItemStack s, NovaConfig cfg) {
                  if (!cfg.armorColorByDurability || !s.isDamageable()) {
                      return WHITE;
                  }
                  float p = (s.getMaxDamage() - s.getDamage()) / (float) s.getMaxDamage();
                  if (p > 0.6f) {
                      return GREEN;
                  }
                  return p > 0.3f ? YELLOW : WARN;
              }

              private static int cellWidth(MinecraftClient mc, ItemStack s, NovaConfig cfg) {
                  return Math.max(18, mc.textRenderer.getWidth(armorText(s, cfg.armorMode)) + 4);
              }

              /** Retorna {largura, altura} ocupadas pela lista de armadura. */
              private static int[] armorSize(MinecraftClient mc, List<ItemStack> items, NovaConfig cfg) {
                  if (items.isEmpty()) {
                      return new int[]{0, 0};
                  }
                  if (!cfg.armorHorizontal) {
                      int w = 0;
                      for (ItemStack s : items) {
                          String t = armorText(s, cfg.armorMode);
                          w = Math.max(w, 18 + (t.isEmpty() ? 0 : mc.textRenderer.getWidth(t)));
                      }
                      return new int[]{w, items.size() * ARMOR_ROW_H};
                  }
                  int w = 0;
                  for (ItemStack s : items) {
                      w += cellWidth(mc, s, cfg);
                  }
                  int h = 18 + (cfg.armorMode == 3 ? 0 : 10);
                  return new int[]{w, h};
              }

              private static void drawArmor(DrawContext ctx, MinecraftClient mc, NovaConfig cfg,
                                            List<ItemStack> items, int x, int y) {
                  TextRenderer tr = mc.textRenderer;
                  if (!cfg.armorHorizontal) {
                      for (ItemStack s : items) {
                          ctx.drawItem(s, x, y);
                          String t = armorText(s, cfg.armorMode);
                          if (!t.isEmpty()) {
                              ctx.drawTextWithShadow(tr, t, x + 18, y + 4, armorColor(s, cfg));
                          }
                          y += ARMOR_ROW_H;
                      }
                      return;
                  }
                  for (ItemStack s : items) {
                      int cw = cellWidth(mc, s, cfg);
                      ctx.drawItem(s, x + (cw - 16) / 2, y);
                      String t = armorText(s, cfg.armorMode);
                      if (!t.isEmpty()) {
                          ctx.drawTextWithShadow(tr, t, x + (cw - tr.getWidth(t)) / 2, y + 18, armorColor(s, cfg));
                      }
                      x += cw;
                  }
              }

              // ------------------------------------------------------------------ utilidades

              private static void updateFps() {
                  frames++;
                  long now = System.nanoTime();
                  if (now - windowStart >= 1_000_000_000L) {
                      fps = frames;
                      frames = 0;
                      windowStart = now;
                  }
              }

              private static String ping(MinecraftClient mc) {
                  if (mc.isInSingleplayer()) {
                      return "-";
                  }
                  ClientPlayNetworkHandler handler = mc.getNetworkHandler();
                  if (handler == null || mc.player == null) {
                      return "-";
                  }
                  PlayerListEntry entry = handler.getPlayerListEntry(mc.player.getUuid());
                  return entry == null ? "-" : entry.getLatency() + " ms";
              }

              private static String capitalize(String s) {
                  if (s.isEmpty()) {
                      return s;
                  }
                  return Character.toUpperCase(s.charAt(0)) + s.substring(1);
              }
          }
          NOVA_EOF_MARKER
          mkdir -p 'src/main/java/com/novaclient'
          cat > 'src/main/java/com/novaclient/MinimapRenderer.java' <<'NOVA_EOF_MARKER'
          package com.novaclient;

          import net.minecraft.block.BlockState;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.texture.NativeImage;
          import net.minecraft.client.texture.NativeImageBackedTexture;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.world.Heightmap;
          import net.minecraft.world.chunk.Chunk;
          import net.minecraft.world.chunk.ChunkStatus;

          /**
           * Minimapa leve: amostra o terreno em baixa frequência para uma textura 64x64 e só a desenha na tela.
           */
          public final class MinimapRenderer {
              public static final int TEX = 64;
              private static final int REFRESH_TICKS = 8;
              private static final int UNKNOWN = 0xFF14141A;

              private static final Identifier ID = new Identifier("novaclient", "minimap");

              private static NativeImageBackedTexture texture;
              private static int ticks = 0;
              private static int cells = 48;
              private static int centerX = 0;
              private static int centerZ = 0;

              private static final int[] COLORS = new int[TEX * TEX];
              private static final int[] HEIGHTS = new int[TEX * TEX];

              private MinimapRenderer() {
              }

              private static void ensure(MinecraftClient mc) {
                  if (texture == null) {
                      texture = new NativeImageBackedTexture(TEX, TEX, true);
                      mc.getTextureManager().registerTexture(ID, texture);
                  }
              }

              public static void tick(MinecraftClient mc) {
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  if (!cfg.minimapEnabled || mc.world == null || mc.player == null) {
                      return;
                  }
                  if (cfg.minimapCells != cells) {
                      ticks = REFRESH_TICKS;
                  }
                  if (++ticks < REFRESH_TICKS) {
                      return;
                  }
                  ticks = 0;

                  ensure(mc);
                  NativeImage img = texture.getImage();
                  if (img == null) {
                      return;
                  }

                  cells = cfg.minimapCells;
                  int half = cells / 2;
                  int px = mc.player.getBlockX();
                  int pz = mc.player.getBlockZ();
                  int py = mc.player.getBlockY();
                  centerX = px;
                  centerZ = pz;

                  ClientWorld world = mc.world;
                  boolean ceiling = world.getDimension().hasCeiling();
                  BlockPos.Mutable pos = new BlockPos.Mutable();

                  // 1ª passada: cor base e altura
                  for (int j = 0; j < cells; j++) {
                      for (int i = 0; i < cells; i++) {
                          int wx = px - half + i;
                          int wz = pz - half + j;
                          int idx = j * TEX + i;
                          sample(world, wx, wz, py, ceiling, pos, idx);
                      }
                  }

                  // 2ª passada: relevo (mais claro se for mais alto que o vizinho do norte) e gravação na imagem
                  for (int j = 0; j < cells; j++) {
                      for (int i = 0; i < cells; i++) {
                          int idx = j * TEX + i;
                          int rgb = COLORS[idx];
                          float f = 1.0f;
                          if (rgb != UNKNOWN && j > 0) {
                              int north = HEIGHTS[idx - TEX];
                              if (HEIGHTS[idx] > north) {
                                  f = 1.15f;
                              } else if (HEIGHTS[idx] < north) {
                                  f = 0.85f;
                              }
                          }
                          int r = Math.min(255, Math.round(((rgb >> 16) & 0xFF) * f));
                          int g = Math.min(255, Math.round(((rgb >> 8) & 0xFF) * f));
                          int b = Math.min(255, Math.round((rgb & 0xFF) * f));
                          img.setColor(i, j, 0xFF000000 | (b << 16) | (g << 8) | r);
                      }
                  }
                  texture.upload();
              }

              private static void sample(ClientWorld world, int wx, int wz, int py, boolean ceiling,
                                         BlockPos.Mutable pos, int idx) {
                  Chunk chunk = world.getChunk(wx >> 4, wz >> 4, ChunkStatus.FULL, false);
                  if (chunk == null) {
                      COLORS[idx] = UNKNOWN;
                      HEIGHTS[idx] = py;
                      return;
                  }

                  int bottom = world.getBottomY();
                  int y;
                  int maxScan;
                  if (ceiling) {
                      y = py;
                      maxScan = 32;
                  } else {
                      y = chunk.sampleHeightmap(Heightmap.Type.WORLD_SURFACE, wx, wz);
                      maxScan = 10;
                  }

                  int rgb = 0;
                  for (int n = 0; n < maxScan && y >= bottom; n++, y--) {
                      pos.set(wx, y, wz);
                      BlockState state = chunk.getBlockState(pos);
                      int color = state.getMapColor(world, pos).color;
                      if (color != 0) {
                          rgb = color;
                          break;
                      }
                  }
                  COLORS[idx] = rgb == 0 ? UNKNOWN : (0xFF000000 | rgb);
                  HEIGHTS[idx] = y;
              }

              public static void draw(DrawContext ctx, MinecraftClient mc, int x, int y, int size) {
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  if (texture == null || mc.player == null || mc.world == null) {
                      return;
                  }

                  ctx.drawTexture(ID, x, y, size, size, 0f, 0f, cells, cells, TEX, TEX);

                  double scale = size / (double) cells;
                  double originX = centerX - cells / 2.0;
                  double originZ = centerZ - cells / 2.0;

                  // waypoints
                  if (cfg.minimapWaypoints) {
                      String d = Waypoints.dim(mc);
                      for (NovaConfig.Waypoint wp : cfg.waypoints) {
                          if (!d.equals(wp.dim)) {
                              continue;
                          }
                          int sx = x + (int) Math.round((wp.x + 0.5 - originX) * scale);
                          int sy = y + (int) Math.round((wp.z + 0.5 - originZ) * scale);
                          sx = Math.max(x + 2, Math.min(x + size - 3, sx));
                          sy = Math.max(y + 2, Math.min(y + size - 3, sy));
                          ctx.fill(sx - 2, sy - 2, sx + 3, sy + 3, 0xFF000000);
                          ctx.fill(sx - 1, sy - 1, sx + 2, sy + 2, wp.color);
                      }
                  }

                  // outros jogadores
                  if (cfg.minimapPlayers) {
                      for (PlayerEntity p : mc.world.getPlayers()) {
                          if (p == mc.player) {
                              continue;
                          }
                          int sx = x + (int) Math.round((p.getX() - originX) * scale);
                          int sy = y + (int) Math.round((p.getZ() - originZ) * scale);
                          if (sx < x + 1 || sx > x + size - 2 || sy < y + 1 || sy > y + size - 2) {
                              continue;
                          }
                          ctx.fill(sx - 1, sy - 1, sx + 2, sy + 2, 0xFFFFD84A);
                      }
                  }

                  // você (branco) + direção (vermelho)
                  int me = x + (int) Math.round((mc.player.getX() - originX) * scale);
                  int mz = y + (int) Math.round((mc.player.getZ() - originZ) * scale);
                  me = Math.max(x + 2, Math.min(x + size - 3, me));
                  mz = Math.max(y + 2, Math.min(y + size - 3, mz));
                  ctx.fill(me - 1, mz - 1, me + 2, mz + 2, 0xFFFFFFFF);
                  double yaw = Math.toRadians(mc.player.getYaw());
                  int tx = me + (int) Math.round(-Math.sin(yaw) * 4);
                  int ty = mz + (int) Math.round(Math.cos(yaw) * 4);
                  ctx.fill(tx, ty, tx + 1, ty + 1, 0xFFE11D2E);

                  // borda vermelha + N
                  int red = 0xFFE11D2E;
                  ctx.fill(x - 1, y - 1, x + size + 1, y, red);
                  ctx.fill(x - 1, y + size, x + size + 1, y + size + 1, red);
                  ctx.fill(x - 1, y, x, y + size, red);
                  ctx.fill(x + size, y, x + size + 1, y + size, red);
                  ctx.drawCenteredTextWithShadow(mc.textRenderer, "N", x + size / 2, y + 2, 0xFFFFFFFF);
              }
          }
