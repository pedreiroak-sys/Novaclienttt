          package com.novaclient;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Configuração salva em .minecraft/config/novaclient.json
           */
          public class NovaConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              public static NovaConfig INSTANCE = new NovaConfig();

              /** Waypoint salvo na config. */
              public static class Waypoint {
                  public String name = "WP";
                  public int x, y, z;
                  public String dim = "minecraft:overworld";
                  public int color = 0xFFE11D2E;
              }

              // HUD
              public boolean hudEnabled = true;
              public boolean showFps = true;
              public boolean showPing = true;
              public boolean showCoords = true;
              public boolean showDirection = true;
              public boolean showClock = false;
              public boolean showCps = true;

              /** Tamanho do HUD em % (60 a 200). Em celular, 100-130 costuma ficar bom. */
              public int hudScalePercent = 100;

              /** 0 = topo-esquerda, 1 = topo-direita, 2 = baixo-esquerda, 3 = baixo-direita */
              public int hudCorner = 0;

              // Armadura
              public boolean showArmor = true;
              /** 0 = número, 1 = porcentagem, 2 = número + %, 3 = só ícone */
              public int armorMode = 1;
              /** 0-3 = cantos, 4 = dentro do painel do HUD */
              public int armorCorner = 4;
              public boolean armorHorizontal = false;
              public boolean armorShowHands = false;
              public boolean armorColorByDurability = true;

              // Minimapa
              public boolean minimapEnabled = true;
              /** Tamanho na tela, em pixels (48 a 128). */
              public int minimapSize = 64;
              /** Quantidade de blocos mostrados por lado (32, 48 ou 64). */
              public int minimapCells = 48;
              public int minimapCorner = 1;
              public boolean minimapPlayers = true;
              public boolean minimapWaypoints = true;

              // Waypoints
              public boolean waypointsInWorld = true;
              public boolean deathWaypoint = true;
              public List<Waypoint> waypoints = new ArrayList<>();

              // Módulos
              public boolean autoSprint = true;
              public boolean fullbright = false;
              public boolean hitDelayFix = true;
              public boolean showKeystrokes = false;
              public int keysCorner = 2;
              public boolean showEffects = false;
              public int effectsCorner = 3;

              /** FOV usado enquanto o zoom está ativo (30 a 110, menor = mais zoom). */
              public int zoomFov = 30;

              /** 0 = normal, 1 = equilibrado, 2 = máximo */
              public int perfProfile = 0;

              private static Path file() {
                  return FabricLoader.getInstance().getConfigDir().resolve("novaclient.json");
              }

              public static void load() {
                  Path path = file();
                  if (!Files.exists(path)) {
                      save();
                      return;
                  }
                  try (Reader reader = Files.newBufferedReader(path, StandardCharsets.UTF_8)) {
                      NovaConfig loaded = GSON.fromJson(reader, NovaConfig.class);
                      if (loaded != null) {
                          INSTANCE = loaded;
                          INSTANCE.sanitize();
                      }
                  } catch (IOException | RuntimeException e) {
                      System.err.println("[NovaClient] Falha ao ler config, usando padrão: " + e);
                      INSTANCE = new NovaConfig();
                  }
              }

              public static void save() {
                  INSTANCE.sanitize();
                  try {
                      Files.createDirectories(file().getParent());
                      try (Writer writer = Files.newBufferedWriter(file(), StandardCharsets.UTF_8)) {
                          GSON.toJson(INSTANCE, writer);
                      }
                  } catch (IOException e) {
                      System.err.println("[NovaClient] Falha ao salvar config: " + e);
                  }
              }

              private void sanitize() {
                  hudScalePercent = Math.max(60, Math.min(200, hudScalePercent));
                  hudCorner = Math.floorMod(hudCorner, 4);
                  zoomFov = Math.max(30, Math.min(110, zoomFov));
                  armorMode = Math.floorMod(armorMode, 4);
                  armorCorner = Math.floorMod(armorCorner, 5);
                  minimapSize = Math.max(48, Math.min(128, minimapSize));
                  minimapCells = Math.max(32, Math.min(64, minimapCells));
                  minimapCorner = Math.floorMod(minimapCorner, 4);
                  keysCorner = Math.floorMod(keysCorner, 4);
                  effectsCorner = Math.floorMod(effectsCorner, 4);
                  perfProfile = Math.floorMod(perfProfile, 3);
                  if (waypoints == null) {
                      waypoints = new ArrayList<>();
                  }
              }
          }
