          package com.novaclient;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.Camera;
          import net.minecraft.util.math.Vec3d;

          import java.util.List;
          import java.util.Locale;

          /**
           * Gerencia waypoints e desenha os marcadores no mundo.
           */
          public final class Waypoints {
              private static final int[] PALETTE = {
                      0xFFE11D2E, 0xFF3B82F6, 0xFF22C55E, 0xFFF59E0B,
                      0xFFA855F7, 0xFF06B6D4, 0xFFEC4899, 0xFFFFFFFF
              };

              private Waypoints() {
              }

              public static String dim(MinecraftClient mc) {
                  return mc.world.getRegistryKey().getValue().toString();
              }

              public static String nextName() {
                  return "WP" + (NovaConfig.INSTANCE.waypoints.size() + 1);
              }

              public static NovaConfig.Waypoint addHere(MinecraftClient mc, String name) {
                  if (mc.player == null || mc.world == null) {
                      return null;
                  }
                  List<NovaConfig.Waypoint> list = NovaConfig.INSTANCE.waypoints;
                  final String d = dim(mc);
                  final String n = name;
                  list.removeIf(w -> w.name != null && w.name.equalsIgnoreCase(n) && d.equals(w.dim));

                  NovaConfig.Waypoint w = new NovaConfig.Waypoint();
                  w.name = name;
                  w.x = mc.player.getBlockX();
                  w.y = mc.player.getBlockY();
                  w.z = mc.player.getBlockZ();
                  w.dim = d;
                  w.color = PALETTE[list.size() % PALETTE.length];
                  list.add(w);
                  NovaConfig.save();
                  return w;
              }

              public static boolean remove(MinecraftClient mc, String name) {
                  if (mc.world == null) {
                      return false;
                  }
                  final String d = dim(mc);
                  final String n = name;
                  boolean removed = NovaConfig.INSTANCE.waypoints
                          .removeIf(w -> w.name != null && w.name.equalsIgnoreCase(n) && d.equals(w.dim));
                  if (removed) {
                      NovaConfig.save();
                  }
                  return removed;
              }

              public static String removeLast(MinecraftClient mc) {
                  if (mc.world == null) {
                      return null;
                  }
                  String d = dim(mc);
                  List<NovaConfig.Waypoint> list = NovaConfig.INSTANCE.waypoints;
                  for (int i = list.size() - 1; i >= 0; i--) {
                      if (d.equals(list.get(i).dim)) {
                          String name = list.remove(i).name;
                          NovaConfig.save();
                          return name;
                      }
                  }
                  return null;
              }

              public static int clear(MinecraftClient mc) {
                  if (mc.world == null) {
                      return 0;
                  }
                  final String d = dim(mc);
                  int before = NovaConfig.INSTANCE.waypoints.size();
                  NovaConfig.INSTANCE.waypoints.removeIf(w -> d.equals(w.dim));
                  NovaConfig.save();
                  return before - NovaConfig.INSTANCE.waypoints.size();
              }

              public static String distanceText(double dist) {
                  if (dist >= 1000) {
                      return String.format(Locale.ROOT, "%.1fkm", dist / 1000.0);
                  }
                  return Math.round(dist) + "m";
              }

              /** Desenha os waypoints do mundo atual projetados na tela. */
              public static void renderWorld(DrawContext ctx, MinecraftClient mc) {
                  NovaConfig cfg = NovaConfig.INSTANCE;
                  if (mc.world == null || mc.player == null || cfg.waypoints.isEmpty()) {
                      return;
                  }
                  Camera cam = mc.gameRenderer.getCamera();
                  if (!cam.isReady()) {
                      return;
                  }

                  Vec3d cp = cam.getPos();
                  double yaw = Math.toRadians(cam.getYaw());
                  double pitch = Math.toRadians(cam.getPitch());
                  double cosY = Math.cos(yaw);
                  double sinY = Math.sin(yaw);
                  double cosP = Math.cos(pitch);
                  double sinP = Math.sin(pitch);

                  // frente, direita e cima da câmera
                  double fx = -sinY * cosP;
                  double fy = -sinP;
                  double fz = cosY * cosP;
                  double rx = -cosY;
                  double ry = 0;
                  double rz = -sinY;
                  double ux = ry * fz - rz * fy;
                  double uy = rz * fx - rx * fz;
                  double uz = rx * fy - ry * fx;

                  int w = ctx.getScaledWindowWidth();
                  int h = ctx.getScaledWindowHeight();
                  double tanV = Math.tan(Math.toRadians(mc.options.getFov().getValue()) / 2.0);
                  double tanH = tanV * ((double) w / (double) h);
                  String d = dim(mc);

                  for (NovaConfig.Waypoint wp : cfg.waypoints) {
                      if (!d.equals(wp.dim)) {
                          continue;
                      }
                      double dx = wp.x + 0.5 - cp.x;
                      double dy = wp.y + 1.0 - cp.y;
                      double dz = wp.z + 0.5 - cp.z;
                      double zc = dx * fx + dy * fy + dz * fz;
                      if (zc <= 0.1) {
                          continue;
                      }
                      double xc = dx * rx + dy * ry + dz * rz;
                      double yc = dx * ux + dy * uy + dz * uz;

                      int screenX = (int) Math.round(w / 2.0 + (xc / zc) / tanH * (w / 2.0));
                      int screenY = (int) Math.round(h / 2.0 - (yc / zc) / tanV * (h / 2.0));
                      if (screenX < 4 || screenX > w - 4 || screenY < 10 || screenY > h - 10) {
                          continue;
                      }

                      double dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                      // marcador em cruz
                      ctx.fill(screenX - 1, screenY - 3, screenX + 2, screenY + 4, wp.color);
                      ctx.fill(screenX - 3, screenY - 1, screenX + 4, screenY + 2, wp.color);
                      ctx.drawCenteredTextWithShadow(mc.textRenderer, wp.name + " " + distanceText(dist),
                              screenX, screenY + 7, 0xFFFFFFFF);
                  }
              }
          }
